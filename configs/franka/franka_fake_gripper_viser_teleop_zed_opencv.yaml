version: "1"

session:
  save_root: recordings

nodes:
  - type: ViserTeleopNode
    name: franka_viser
    agent_class: robots_realtime.agents.teleoperation.franka_pyroki_viser_agent:FrankaPyrokiViserAgent
    agent_kwargs:
      viser_port: 8765
      ik_rate: 30.0
      robotiq_gripper: false
      visualize_rgbd: false
    arm_key: left
    ik_freq: 30.0
    viz_freq: 20.0
    state_topics:
      left: franka/joint_state
    image_topics:
      camera_top: camera_top/rgb

  - type: RobotNode
    name: franka
    robot_config: robot_configs/franka/franka_fake_gripper.yaml
    cmd_topic: franka_viser/joint_pos
    poll_freq: 100.0

  - type: CameraNode
    name: camera_top
    driver: robots_realtime.sensors.cameras.opencv_camera:OpencvCamera
    device_path: /dev/video4
    camera_type: zed_opencv
    resolution: [1344, 376]
    fps: 30
