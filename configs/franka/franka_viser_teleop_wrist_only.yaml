# Franka + standalone viser teleop (no vos client) + wrist ZED only.
#
# Combines franka_robotiq_viser_teleop.yaml's standalone teleop agent
# (FrankaPyrokiViserAgent — does its own IK, needs no port-9001 client)
# with franka_curobo_wrist_only.yaml's wrist ZED camera node.
#
# Use case: wrist-camera hand-eye calibration, where you want to drag the
# arm via the rr-session viser UI (port 8765) and stream the wrist ZED to
# the broker (camera_wrist/rgb) without spinning up vos serve.
#
# Pair with:
#   uv run python tools/calibrate_camera.py --mode wrist --image-source zmq

version: "1"

session:
  save_root: recordings

nodes:
  - type: ViserTeleopNode
    name: franka_viser
    agent_class: robots_realtime.agents.teleoperation.franka_pyroki_viser_agent:FrankaPyrokiViserAgent
    agent_kwargs:
      viser_port: 8765
      ik_rate: 30.0
      robotiq_gripper: true
    arm_key: left
    ik_freq: 30.0
    viz_freq: 20.0
    state_topics:
      left: franka/joint_state       # "left" so _extract_joint_pos finds it
    image_topics:
      camera_wrist: camera_wrist/rgb

  - type: RobotNode
    name: franka
    robot_config: robot_configs/franka/franka_robotiq_gripper.yaml
    cmd_topic: franka_viser/joint_pos
    poll_freq: 100.0

  - type: CameraNode
    name: camera_wrist
    driver: ZedCamera
    stream_ip: "172.16.0.3"
    enable_depth: false
    resolution: HD720
